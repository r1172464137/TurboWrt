name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      ssh_connect:
        description: 'SSH connection to the build'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v25.12.4
  CONFIG_FILE: config.seed
  DIY_SH: diy.sh
  SSH_ACTIONS: false
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y build-essential gcc-multilib g++-multilib libncurses-dev \
          libssl-dev libelf-dev zlib1g-dev bison flex git unzip wget python3 python3-pip \
          python3-docutils rsync file curl gettext libgmp3-dev libmpc-dev libmpfr-dev \
          patch bc lz4 zstd p7zip p7zip-full xz-utils jq

    - name: Clone OpenWrt source
      run: |
        git clone --depth 1 --branch $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Clone third-party packages
      run: |
        cd openwrt
        git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/new/luci-app-lucky
        git clone --depth 1 https://github.com/sbwml/luci-app-openlist2.git package/new/luci-app-openlist2
        git clone --depth 1 https://github.com/sbwml/luci-app-mosdns.git package/new/luci-app-mosdns
        git clone --depth 1 https://github.com/sbwml/openwrt_helloworld.git package/new/openwrt_helloworld
        git clone --depth 1 https://github.com/sbwml/luci-app-quickfile.git package/new/luci-app-quickfile
        git clone --depth 1 https://github.com/sirpdboy/luci-app-ddns-go.git package/new/luci-app-ddns-go
        git clone --depth 1 https://github.com/UnblockNeteaseMusic/luci-app-unblockneteasemusic.git package/new/luci-app-unblockneteasemusic
        git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git package/new/luci-app-easytier
        git clone --depth 1 https://github.com/timsaya/luci-app-bandix.git package/new/luci-app-bandix
        git clone --depth 1 https://github.com/timsaya/openwrt-bandix.git package/new/openwrt-bandix
        git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/new/luci-theme-argon
        git clone --depth 1 https://github.com/eamonxg/luci-theme-aurora.git package/new/luci-theme-aurora
        git clone --depth 1 https://github.com/eamonxg/luci-theme-shadcn.git package/new/luci-theme-shadcn
        git clone --depth 1 https://github.com/eamonxg/luci-app-aurora-config.git package/new/luci-app-aurora-config
        # Fix nested structures
        cp -rf package/new/luci-app-bandix/luci-app-bandix/* package/new/luci-app-bandix/ && rm -rf package/new/luci-app-bandix/luci-app-bandix
        cp -rf package/new/openwrt-bandix/openwrt-bandix/* package/new/openwrt-bandix/ && rm -rf package/new/openwrt-bandix/openwrt-bandix
        cp -rf package/new/luci-app-lucky/luci-app-lucky/* package/new/luci-app-lucky/ && rm -rf package/new/luci-app-lucky/luci-app-lucky
        cp -rf package/new/luci-app-easytier/luci-app-easytier/* package/new/luci-app-easytier/ && rm -rf package/new/luci-app-easytier/luci-app-easytier
        cp -rf package/new/luci-app-ddns-go/luci-app-ddns-go/* package/new/luci-app-ddns-go/ && rm -rf package/new/luci-app-ddns-go/luci-app-ddns-go
        # Create symlinks for helloworld sub-packages
        cd package/new && for sub in luci-app-homeproxy luci-app-nikki luci-app-passwall luci-app-dae luci-app-openclash luci-app-ssr-plus; do [ -d "openwrt_helloworld/$sub" ] && ln -sf "openwrt_helloworld/$sub" "$sub" 2>/dev/null || true; done
        cd /home/runner/work/openwrt-custom-fw/openwrt-custom-fw/openwrt

    - name: Apply patches & config
      run: |
        cd openwrt
        # Copy config
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config

        # Apply kernel patches
        cp -rf $GITHUB_WORKSPACE/patches/kernel/bbr3/* target/linux/generic/backport-6.12/
        cp -rf $GITHUB_WORKSPACE/patches/kernel/other/* target/linux/generic/

        # Apply custom configs
        cat $GITHUB_WORKSPACE/patches/config-append.txt >> target/linux/generic/config-6.12

        # Run diy script if exists
        [ -f $GITHUB_WORKSPACE/$DIY_SH ] && bash $GITHUB_WORKSPACE/$DIY_SH

        make defconfig

    - name: Download sources
      run: |
        cd openwrt
        make download -j$(nproc)

    - name: SSH connection (optional)
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event.inputs.ssh_connect == 'true' }}

    - name: Build firmware
      run: |
        cd openwrt
        make -j$(nproc) PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      timeout-minutes: 360

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-firmware
        path: |
          openwrt/bin/targets/x86/64/*.gz
          openwrt/bin/targets/x86/64/*.iso
          openwrt/bin/targets/x86/64/*.vmdk
          openwrt/bin/targets/x86/64/*.qcow2
          openwrt/bin/targets/x86/64/*.vhdx
          openwrt/bin/targets/x86/64/*.manifest
        if-no-files-found: warn
