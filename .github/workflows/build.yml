name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      ssh_connect:
        description: 'SSH connection to the build'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        uses: smallprogram/maximize-build-space@master
        with:
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install -y -qq build-essential gcc-multilib g++-multilib \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev bison flex git unzip wget \
            python3 python3-pip python3-docutils python3-pyelftools rsync file curl \
            gettext libgmp3-dev libmpc-dev libmpfr-dev patch bc lz4 zstd p7zip p7zip-full \
            xz-utils jq

      - name: Clone source & feeds
        run: |
          git clone --depth 1 --branch v25.12.4 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Setup
        run: |
          chmod +x $GITHUB_WORKSPACE/setup.sh
          bash $GITHUB_WORKSPACE/setup.sh $GITHUB_WORKSPACE/openwrt $GITHUB_WORKSPACE

      - name: Download
        run: |
          cd openwrt && make download -j50

      - name: SSH (optional)
        if: ${{ github.event.inputs.ssh_connect == 'true' }}
        uses: mxschmitt/action-tmate@v3

      - name: Build
        id: build
        continue-on-error: true
        run: |
          cd openwrt && IGNORE_ERRORS=1 make -j$(($(nproc) + 1))

      - name: Error retry
        if: steps.build.outcome == 'failure'
        run: |
          cd openwrt && make -j1 V=s

      - name: Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: "Firmware-$(date +%Y%m%d-%H%M)"
          files: |
            openwrt/bin/targets/x86/64/openwrt-x86-64-generic-ext4-combined-efi.img.gz
            openwrt/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined-efi.img.gz
          fail_on_unmatched: false
