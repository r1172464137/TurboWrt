name: Debug Package Build

on:
  workflow_dispatch:
    inputs:
      package:
        description: '软件包路径，如 package/new/openwrt_helloworld/dae'
        required: true
        default: 'package/new/openwrt_helloworld/dae'

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc-multilib g++-multilib \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev bison flex git unzip wget \
            python3 python3-pip python3-pyelftools rsync file curl gettext \
            libgmp3-dev libmpc-dev libmpfr-dev patch bc lz4 zstd xz-utils jq ccache clang llvm lld

      - name: Clone source & feeds
        run: |
          git clone --depth 1 --branch v25.12.4 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Clone third-party packages
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/sbwml/openwrt_helloworld.git package/new/openwrt_helloworld
          for sub in luci-app-homeproxy luci-app-nikki luci-app-passwall luci-app-dae luci-app-openclash luci-app-ssr-plus; do
            [ -d "package/new/openwrt_helloworld/$sub" ] && ln -sf "openwrt_helloworld/$sub" "package/new/$sub" 2>/dev/null || true
          done

      - name: Compile toolchain
        run: |
          cd openwrt
          echo "CONFIG_TARGET_x86=y" > .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          make defconfig
          make tools/compile -j$(nproc)
          make toolchain/compile -j$(nproc)

      - name: Debug compile ${{ github.event.inputs.package }}
        run: |
          cd openwrt
          echo "=== Compiling ${{ github.event.inputs.package }} with V=s ==="
          make ${{ github.event.inputs.package }}/compile V=s -j1 2>&1
