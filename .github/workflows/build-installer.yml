name: "构建 ISO 安装器（手动输入固件链接）"

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: '固件下载地址 (.img.gz / .img.xz / .img.zip)'
        required: true
        default: 'https://example.com/firmware.img.gz'

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 校验下载地址
        run: |
          URL="${{ github.event.inputs.download_url }}"
          if [[ ! "$URL" =~ ^https?:// ]]; then
            echo "❌ 地址必须以 http:// 或 https:// 开头"
            exit 1
          fi

      - name: 克隆 img-installer 并构建 ISO
        run: |
          git clone --depth 1 https://github.com/wukongdaily/img-installer.git /tmp/installer
          chmod +x /tmp/installer/custom.sh
          /tmp/installer/custom.sh "${{ github.event.inputs.download_url }}"

      - name: 发布 ISO
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: "Installer-ISO-$(date +%Y%m%d-%H%M)"
          files: /tmp/installer/output/custom-installer-x86_64.iso
